name: GitHub Stats

on:
  # Regenerate daily so the cards stay current with new activity.
  schedule:
    - cron: "0 18 * * *"
  # Lets you trigger a manual run from the Actions tab (Run workflow button)
  # instead of waiting for the next scheduled run.
  workflow_dispatch: {}
  # Regenerate whenever the workflow itself changes, so a config edit is
  # visible immediately rather than waiting up to 24h.
  push:
    branches:
      - main
    paths:
      - .github/workflows/schedule.yml

jobs:
  update-stats:
    name: Update GitHub Stats SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          # ACCESS_TOKEN needs `repo` (read) scope so private-repo activity is
          # included — public GITHUB_TOKEN alone can only see public repos.
          # Created and stored by the repo owner via Settings, never handled
          # by anyone else.
          access_token: ${{ secrets.ACCESS_TOKEN }}
